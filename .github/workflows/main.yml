name: HIL Hardware Validation Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  hil-hardware-tests:
    name: Execute HIL Tests on Raspberry Pi Hardware
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build HIL Docker Image
        run: |
          docker build -t hil-tester:latest .

      - name: Run Automated HIL Tests in Docker Container
        run: |
          mkdir -p reports
          docker run --rm \
            --device=/dev/ttyS0:/dev/ttyS0 \
            --device=/dev/spidev0.0:/dev/spidev0.0 \
            --device=/dev/snd:/dev/snd \
            -v $(pwd)/reports:/app/reports \
            hil-tester:latest

      - name: Fix Report File Permissions
        if: always()
        run: |
          sudo chmod -R 777 reports || true

      - name: Publish Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-test-execution-reports
          path: |
            reports/report.html
            reports/junit.xml