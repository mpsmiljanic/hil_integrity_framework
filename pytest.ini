[pytest]
# Directory and file discovery options
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Console logging and output verbosity
addopts = -v -s --showlocals

# Custom test category markers for HIL protocol testing
markers =
    uart: Hardware-in-the-Loop tests for UART interface
    spi: Hardware-in-the-Loop tests for SPI bus integrity
    i2s: Hardware-in-the-Loop tests for I2S/PCM audio streaming
    stress: Long-running stress and load tests
    dependency: Test dependency marker for cascading execution
